<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h4>HTML Downloader</h4>
  
  <div class="options">
    <label>
      <input type="radio" name="format" value="html" checked> HTMLのみ
    </label>
    <label>
      <input type="radio" name="format" value="mhtml"> ページ全体 (MHTML)
    </label>
  </div>

  <button id="downloadBtn">ダウンロード</button>
  <button id="openFolderBtn" style="display: none; background-color: #2196F3; margin-top: 10px;">保存先フォルダを開く</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
