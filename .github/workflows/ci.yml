name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify build process
        run: |
          mkdir -p dist
          cp -r icons dist/
          cp manifest.json popup.html popup.js style.css dist/
          echo "Build successful."
